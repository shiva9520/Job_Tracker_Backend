name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Node.js Test & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js && node --check app.js

      - name: Run smoke tests
        run: npm test
