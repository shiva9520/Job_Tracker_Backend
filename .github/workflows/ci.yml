name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: node --check server.js && node --check app.js
      - run: npm test

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: job-tracker-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    name: Deploy Image
    needs: [test, docker-build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd.yml
    secrets: inherit
