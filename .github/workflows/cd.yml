name: CD Publish Container Image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GHCR & Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Set image names
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$HUB_USER" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is missing."
            exit 1
          fi
          echo "ghcr=ghcr.io/${OWNER,,}/job-tracker-backend" >> "$GITHUB_OUTPUT"
          echo "hub=${HUB_USER,,}/job-tracker-backend" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: |
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.hub }}:latest
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.sha }}
