name: CD Publish Container Image

on:
  workflow_call:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push to GHCR & Docker Hub
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "job-tracker-backend:${{ github.sha }}" .

      - name: Push to GitHub Container Registry (GHCR)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/job-tracker-backend
          SHORT_SHA: ${{ github.sha }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag "job-tracker-backend:${SHORT_SHA}" "${IMAGE_LOWER}:latest"
          docker tag "job-tracker-backend:${SHORT_SHA}" "${IMAGE_LOWER}:${SHORT_SHA}"
          docker push "${IMAGE_LOWER}:latest"
          docker push "${IMAGE_LOWER}:${SHORT_SHA}"

      - name: Push to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          DOCKERHUB_USER_LOWER=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          HUB_IMAGE="${DOCKERHUB_USER_LOWER}/job-tracker-backend"
          docker tag "job-tracker-backend:${SHORT_SHA}" "${HUB_IMAGE}:latest"
          docker tag "job-tracker-backend:${SHORT_SHA}" "${HUB_IMAGE}:${SHORT_SHA}"
          docker push "${HUB_IMAGE}:latest"
          docker push "${HUB_IMAGE}:${SHORT_SHA}"
