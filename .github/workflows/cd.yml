name: CD Publish Container Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate with GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/job-tracker-backend
          SHORT_SHA: ${{ github.sha }}
        run: |
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build -t "${IMAGE_LOWER}:latest" -t "${IMAGE_LOWER}:${SHORT_SHA}" .
          docker push "${IMAGE_LOWER}:latest"
          docker push "${IMAGE_LOWER}:${SHORT_SHA}"
